<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* 기존 스타일 유지 */
        .article-container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .comments-section { margin-top: 40px; padding-top: 20px; border-top: 1px solid #dee2e6; }
        .comments-title { margin-bottom: 20px; color: #333; }
        .comment-item { padding: 15px; border-bottom: 1px solid #dee2e6; }
        .comment-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: #666; font-size: 0.9rem; }
        .comment-content { margin-bottom: 10px; line-height: 1.5; }
        .comment-actions { display: flex; gap: 10px; }
    </style>
</head>
<body class="bg-light">
<div class="container">
    <div class="article-container">
        <!-- 게시글 정보 -->
        <div class="article-header">
            <h1 class="article-title" th:text="${article.title}">제목</h1>
            <div class="article-meta">
                <span><i class="bi bi-person-circle"></i><span th:text="${article.user.name}">작성자</span></span>
            </div>
        </div>

        <div class="article-content" th:text="${article.content}">
            게시글 내용
        </div>

        <!-- 댓글 섹션 -->
        <div class="comments-section">
            <h3 class="comments-title">댓글</h3>

            <!-- 댓글 작성 폼 -->
            <div th:if="${session.loginUser != null}" class="comment-form">
                <textarea id="comment-input" class="form-control" rows="3" placeholder="댓글을 입력하세요"></textarea>
                <!-- 댓글 작성 버튼 -->
                <button th:attr="data-article-id=${article.id}" onclick="addComment(this.dataset.articleId)" class="btn btn-primary">
                    댓글 작성
                </button>
            </div>
            <div th:unless="${session.loginUser != null}" class="alert alert-info">
                댓글을 작성하려면 <a th:href="@{/login}">로그인</a>이 필요합니다.
            </div>

            <!-- 댓글 목록 -->
            <div id="comment-list" class="comments-list mt-4">
                <!-- 댓글 항목 -->
                <div th:each="comment : ${article.comments}" class="comment-item" id="comment-[[${comment.id}]]">
                    <div class="comment-header">
                        <span class="comment-author" th:text="${comment.user.name}">작성자</span>
                        <span class="comment-date" th:text="${#temporals.format(comment.createdDate, 'yyyy-MM-dd HH:mm')}">작성일</span>
                    </div>
                    <div class="comment-content" th:text="${comment.comment}">댓글 내용</div>
                    <!-- 댓글 수정/삭제 버튼 -->
                    <div class="comment-actions" th:if="${session.loginUser != null and session.loginUser.id == comment.user.id}">
                        <button onclick="deleteComment(this.dataset.commentId)" data-comment-id="${comment.id}">삭제</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/comment.js"></script> <!-- comment.js 연결 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
